<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- ✅ MOBILE SUPPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valentine Blast 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle, #ff9a9e, #fad0c4, #fad0c4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.5);
      backdrop-filter: blur(10px);
      animation: pop 1.5s ease;
      max-width: 90%;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ✅ RESPONSIVE TEXT */
    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      color: #fff;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #ff3366;
    }

    p {
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      color: #fff;
      margin-bottom: 25px;
    }

    button {
      padding: 12px 30px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background: #ff3366;
      color: white;
    }

    .yes:hover {
      background: #ff0033;
      transform: scale(1.1);
    }

    .no {
      background: white;
      color: #ff3366;
    }

    #surprise {
      margin-top: 25px;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      color: #fff;
      display: none;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #ff0055; }
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="title">Happy Valentine’s Day 💘</h1>
    <p id="text">You make my world brighter ✨</p>

    <button class="yes" onclick="sayYes()">Yes 💖</button>
    <button class="no">No 🙈</button>

    <div id="surprise">
      I knew it 😍💞 You are my Valentine forever 💍
    </div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("title").innerText = "Yayyy 🎉💖";
      document.getElementById("text").innerText =
        "This moment just became special forever 💫";
      document.getElementById("surprise").style.display = "block";
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 300);
  </script>

</body>
</html>

<title>Be My Valentine</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {

}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
}

button {
    padding: 12px 25px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    position: relative;
}

#yesBtn {
    background-color: #ff6b81;
    color: #fff;
}

#yesBtn:hover {
    transform: scale(1.2) rotateX(15deg) rotateY(-10deg);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

#noBtn {
    background-color: #fff;
    color: #ff6b81;
    border: 2px solid #ff6b81;
    position: relative;
}

#message {
    margin-top: 30px;
    font-size: 1.2rem;
    color: #fff;
    max-width: 90%;
    line-height: 1.5;
    text-shadow: 1px 1px 5px #ff6b81;
    opacity: 0;
    transition: opacity 0.8s;
}

#funImage {
    margin-top: 20px;
    max-width: 250px;
    max-height: 250px;
    display: none;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

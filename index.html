<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    text-align: center;
    perspective: 1200px;
}

h1 {
    font-size: 2.5rem;
    color: #fff;
    margin-bottom: 30px;
    text-shadow: 3px 3px 15px #ff6b81;
    transform: rotateY(10deg);
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
}

button {
    padding: 12px 25px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.5s, box-shadow 0.5s, background 0.3s;
    transform-style: preserve-3d;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative;
}

button:active {
    box-shadow: 0 0 25px #fff, 0 0 50px #ff6b81, 0 0 75px #ff6b81;
}

#yesBtn {
    background-color: #ff6b81;
    color: #fff;
}

#yesBtn:hover {
    transform: scale(1.3) rotateX(15deg) rotateY(-10deg);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

#noBtn {
    background-color: #fff;
    color: #ff6b81;
    border: 2px solid #ff6b81;
}

#message {
    margin-top: 30px;
    font-size: 1.2rem;
    color: #fff;
    max-width: 90%;
    line-height: 1.5;
    text-shadow: 2px 2px 8px #ff6b81;
    opacity: 0;
    transition: opacity 0.8s;
}

#funImage {
    margin-top: 20px;
    max-width: 300px;
    max-height: 300px;
    display: none;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transform-style: preserve-3d;
    transition: transform 0.6s, opacity 0.5s;
}

.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: red;
    opacity: 0.8;
    pointer-events: none;
    transform: rotate(45deg);
    border-radius: 2px;
}
@keyframes bounceShakeGlow {
    0% { transform: scale(1) rotate(0deg); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    20% { transform: scale(1.2) rotate(-15deg); box-shadow: 0 0 30px #ff6b81; }
    40% { transform: scale(1) rotate(10deg); box-shadow: 0 0 35px #ff6b81; }
    60% { transform: scale(1.15) rotate(-10deg); box-shadow: 0 0 40px #ff6b81; }
    80% { transform: scale(1) rotate(5deg); box-shadow: 0 0 30px #ff6b81; }
    100% { transform: scale(1) rotate(0deg); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
}
</style>
</head>
<body>

<h1>Baby, can you be my Valentine?</h1>
<div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
</div>

<img id="funImage" src="" alt="Fun Image">
<div id="message"></div>

<audio id="yesSound" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('message');
const funImage = document.getElementById('funImage');
const yesSound = document.getElementById('yesSound');

// Fun images sequence
const funImages = [
    'https://i.postimg.cc/43vpt2qX/monkey.png',   // monkey middle finger
    'https://i.postimg.cc/3x3Qg5q9/gorilla.png',  // gorilla middle finger
    'https://i.postimg.cc/9fRr9r4x/person.png',   // person middle finger
    'https://i.postimg.cc/6qG5VgDL/girl.png'      // girl middle finger
];

let clickCount = 0;

// Show image with 3D pop
function showFunImage(imgUrl) {
    funImage.src = imgUrl;
    funImage.style.display = 'block';
    funImage.style.opacity = 0;
    funImage.style.transform = `rotateY(0deg) rotateX(0deg) scale(0.5)`;
    
    setTimeout(() => {
        funImage.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
        funImage.style.opacity = 1;
        funImage.style.transform = `rotateY(${Math.random()*30-15}deg) rotateX(${Math.random()*20-10}deg) scale(1.1)`;
    }, 50);

    setTimeout(() => {
        funImage.style.transform = `rotateY(${Math.random()*10-5}deg) rotateX(${Math.random()*5-2}deg) scale(1)`;
    }, 800);
}

// Animate No button
function animateNoButton() {
    noBtn.style.animation = 'bounceShakeGlow 0.8s';
    setTimeout(() => noBtn.style.animation = '', 800);
}

// Confetti effect
function createConfetti(x, y) {
    const colors = ['#ff4757','#ff6b81','#ffb6c1','#ffd700','#ffa500'];
    for(let i=0; i<40; i++){
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        confetti.style.left = x + 'px';
        confetti.style.top = y + 'px';
        document.body.appendChild(confetti);

        const angle = Math.random()*2*Math.PI;
        const distance = 100 + Math.random()*200;
        confetti.animate([
            { transform: `translate(0,0) rotate(${Math.random()*360}deg)`, opacity:1 },
            { transform: `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px) rotate(${Math.random()*720}deg)`, opacity:0 }
        ], { duration: 2000 + Math.random()*1000, easing: 'ease-out' });

        setTimeout(()=>confetti.remove(), 2500);
    }
}

// No button click
noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    showFunImage(funImages[clickCount]);
    animateNoButton();
    clickCount = (clickCount + 1) % funImages.length;
});

// Yes button click
yesBtn.addEventListener('click', (e) => {
    yesSound.play();
    message.innerHTML = `
        🌹 Aww, you said YES! 🌹<br><br>
        Baby, you are the light of my life. Every moment with you
        feels magical and unforgettable. I promise to always cherish,
        love, and support you. Will you make me the happiest person 
        alive and stay mine forever? 💖
    `;
    message.style.opacity = 1;
    yesBtn.style.backgroundColor = '#ff4757';
    yesBtn.style.transform = 'scale(1.3) rotateX(20deg) rotateY(-15deg)';

    const rect = yesBtn.getBoundingClientRect();
    createConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
});
</script>
</body>
</html>

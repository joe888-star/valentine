<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    perspective: 1000px;
    text-align: center;
}

h1 {
    font-size: 2.8rem;
    color: #fff;
    margin-bottom: 40px;
    text-shadow: 3px 3px 10px #ff6b81;
    transform: rotateY(10deg);
}

.buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    position: relative;
}

button {
    padding: 12px 25px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    transform-style: preserve-3d;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    position: relative;
}

button:active {
    box-shadow: 0 0 25px #fff, 0 0 50px #ff6b81, 0 0 75px #ff6b81;
}

#yesBtn {
    background-color: #ff6b81;
    color: #fff;
}

#yesBtn:hover {
    transform: scale(1.2) rotateX(15deg) rotateY(-10deg);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

#noBtn {
    background-color: #fff;
    color: #ff6b81;
    border: 2px solid #ff6b81;
    position: relative;
}

#message {
    margin-top: 40px;
    font-size: 1.3rem;
    color: #fff;
    max-width: 90%;
    line-height: 1.6;
    text-shadow: 2px 2px 5px #ff6b81;
    opacity: 0;
    transition: opacity 1s ease-in;
}

#funImage {
    margin-top: 30px;
    max-width: 300px;
    max-height: 300px;
    display: none;
}
</style>
</head>
<body>

<h1>Baby, can you be my Valentine?</h1>
<div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
</div>

<img id="funImage" src="" alt="Fun Image">
<div id="message"></div>

<audio id="yesSound" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('message');
const funImage = document.getElementById('funImage');
const yesSound = document.getElementById('yesSound');

// Fun images sequence (replace with your own if needed)
const funImages = [
    'https://i.imgur.com/kf1C0tL.png', // gorilla middle finger
    'https://i.imgur.com/9FJGJgF.png', // person splitting
    'https://i.imgur.com/kf1C0tL.png'  // middle finger again
];

let clickCount = 0;

// Function to move No button randomly
function moveNoButtonSmart() {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    let newX = Math.random() * (window.innerWidth - btnWidth - 20);
    let newY = Math.random() * (window.innerHeight - btnHeight - 20);
    noBtn.style.position = 'absolute';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
}

// Function to handle No button click/tap
function handleNoClick(e) {
    e.preventDefault();

    // Move the No button
    moveNoButtonSmart();

    // Show next fun image
    funImage.src = funImages[clickCount];
    funImage.style.display = 'block';
    clickCount = (clickCount + 1) % funImages.length;
}

// Detect mouse and touch interactions for No button
noBtn.addEventListener('click', handleNoClick);
noBtn.addEventListener('touchstart', handleNoClick);

// Yes button click
yesBtn.addEventListener('click', () => {
    yesSound.play();
    message.innerHTML = `
        🌹 Aww, you said YES! 🌹<br><br>
        Baby, you are the light of my life. Every moment with you
        feels magical and unforgettable. I promise to always cherish,
        love, and support you. Will you make me the happiest person 
        alive and stay mine forever? 💖
    `;
    message.style.opacity = 1;
    yesBtn.style.backgroundColor = '#ff4757';
    yesBtn.style.transform = 'scale(1.3) rotateX(20deg) rotateY(-15deg)';
});
</script>
</body>
</html>
